# الإنتاج: الكود داخل الصور، OPcache مفعّل، والفرونت مبني standalone بحاوية مقيّدة.
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
x-laravel-prod: &laravel-prod
  image: quran-review-backend:prod
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
  volumes:
    - backend-storage:/var/www/html/storage

services:
  backend:
    <<: *laravel-prod
    build:
      target: production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # عند الإقلاع: انتظار القاعدة ثم migrate --force و optimize و storage:link
      AUTORUN_ENABLED: "true"

  queue:
    <<: *laravel-prod
    depends_on:
      backend:
        condition: service_healthy

  scheduler:
    <<: *laravel-prod
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      target: production
      args:
        BACKEND_INTERNAL_URL: http://backend:8080
        NEXT_PUBLIC_API_BASE_URL: ${FRONTEND_PUBLIC_API_URL:-http://localhost:8000}
    image: quran-review-frontend:prod
    read_only: true
    tmpfs:
      - /tmp
      # uid 1000 = المستخدم node
      - /app/.next/cache:uid=1000,gid=1000,mode=0755
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-storage:

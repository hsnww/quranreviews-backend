# الإعداد المشترك. يُدمج تلقائيًا مع:
#   compose.override.yaml  ← التطوير (docker compose up)
#   compose.prod.yaml      ← الإنتاج (docker compose -f compose.yaml -f compose.prod.yaml up)
# القيم ${...} تُقرأ من .env الخاص بـ Laravel.
name: quran-review

x-laravel: &laravel
  env_file: .env
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  depends_on:
    mysql:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      # للوصول من أدوات مثل HeidiSQL/TablePlus على جهازك فقط
      - "127.0.0.1:3307:3306"
    healthcheck:
      # 127.0.0.1 يفرض TCP، فلا تُعلَن الجاهزية قبل أن يقبل الاتصالات من الشبكة
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    <<: *laravel
    build:
      context: .
    ports:
      - "127.0.0.1:8000:8080"

  queue:
    <<: *laravel
    pull_policy: never
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--sleep=3"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 10s

  scheduler:
    <<: *laravel
    pull_policy: never
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 10s

  frontend:
    build:
      context: ../quran-review-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  mysql-data:
